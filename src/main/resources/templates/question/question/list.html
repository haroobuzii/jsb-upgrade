<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
    <!--/* 부트스트랩: 파일을 내려받지 않고 cdnjs 주소로 바로 사용 (14163 39강) */-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/resource/style.css}">
</head>
<body>

<div class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--/* loop: 반복 상태 변수. loop.count 는 1부터 시작하는 순번 */-->
        <tr th:each="question, loop : ${questionList}">
            <td th:text="${loop.count}"></td>
            <td>
                <!--/* @{...}: URL 을 만든다(컨텍스트 경로 자동 포함). |...|: 문자열 안에 ${...} 값을 끼워 넣는다 */-->
                <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
            </td>
            <!--/* #temporals.format: LocalDateTime 을 원하는 형식의 문자열로 */-->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
