<!--/* layout.html 을 틀로 쓰고, 이 파일은 content 조각과 title 만 제공한다 */-->
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>질문 목록</title>
</head>
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--/* loop: 반복 상태 변수. loop.count 는 1부터 시작하는 순번 */-->
        <tr th:each="question, loop : ${questionList}">
            <td th:text="${loop.count}"></td>
            <td>
                <!--/* @{...}: URL 을 만든다(컨텍스트 경로 자동 포함). |...|: 문자열 안에 ${...} 값을 끼워 넣는다 */-->
                <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
            </td>
            <!--/* #temporals.format: LocalDateTime 을 원하는 형식의 문자열로 */-->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/questions/write}" class="btn btn-primary">질문 등록하기</a>
</div>
</html>
