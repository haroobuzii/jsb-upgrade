<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 목록</title>
</head>
<body>

<h1>질문 목록</h1>

<table>
    <thead>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일시</th>
    </tr>
    </thead>
    <tbody>
    <!--/* th:each: questionList 의 질문 하나하나를 question 이라는 이름으로 반복 */-->
    <tr th:each="question : ${questionList}">
        <!--/* th:text: 태그 안의 내용을 값으로 바꾼다 (HTML 은 이스케이프되어 안전) */-->
        <td th:text="${question.id}"></td>
        <td th:text="${question.subject}"></td>
        <td th:text="${question.createDate}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
