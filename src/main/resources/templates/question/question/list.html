<!--/* layout.html 을 틀로 쓰고, 이 파일은 content 조각과 title 만 제공한다 */-->
<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>질문 목록</title>
</head>
<div layout:fragment="content" class="container my-3">
    <div class="row my-3">
        <div class="col-6">
            <a th:href="@{/questions/write}" class="btn btn-primary">질문 등록하기</a>
        </div>
        <div class="col-6">
            <!--/* 검색: GET /questions?kw=... (조회이므로 GET, 주소로 공유 가능). 검색하면 0페이지부터 */-->
            <form th:action="@{/questions}" method="get" class="input-group">
                <input type="text" name="kw" class="form-control" th:value="${kw}" placeholder="검색어">
                <button class="btn btn-outline-secondary" type="submit">찾기</button>
            </form>
        </div>
    </div>
    <table class="table">
        <thead class="table-dark">
        <tr class="text-center">
            <th>번호</th>
            <th style="width:50%">제목</th>
            <th>글쓴이</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!--/* loop: 반복 상태 변수. loop.index 는 0부터 시작하는 순번
             번호 = 전체 개수 - (현재 페이지 × 페이지 크기) - 페이지 안 순번 → 최신 글이 가장 큰 번호, 페이지가 바뀌어도 이어진다 */-->
        <tr class="text-center" th:each="question, loop : ${paging}">
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}"></td>
            <td class="text-start">
                <!--/* @{...}: URL 을 만든다(컨텍스트 경로 자동 포함). |...|: 문자열 안에 ${...} 값을 끼워 넣는다 */-->
                <a th:href="@{|/questions/${question.id}|}" th:text="${question.subject}"></a>
                <!--/* 답변이 있으면 개수를 빨간 글씨로 */-->
                <span class="text-danger small ms-2" th:if="${#lists.size(question.answers) > 0}"
                      th:text="${#lists.size(question.answers)}"></span>
            </td>
            <!--/* ?. : author 가 null(016 이전 글)이면 오류 없이 빈칸 */-->
            <td th:text="${question.author?.username}"></td>
            <!--/* #temporals.format: LocalDateTime 을 원하는 형식의 문자열로 */-->
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <!--/* 페이징: paging.number 는 0부터, 화면에는 1부터 보여 준다(page + 1). 현재 페이지 앞뒤 5개까지만
         @{/questions(page=..., kw=...)}: 쿼리 파라미터를 붙인 URL (값은 자동으로 URL 인코딩). 검색어를 유지한 채 페이지 이동 */-->
    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number - 1}, kw=${kw})}">이전</a>
            </li>
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'" class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{/questions(page=${page}, kw=${kw})}"></a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/questions(page=${paging.number + 1}, kw=${kw})}">다음</a>
            </li>
        </ul>
    </div>
</div>
</html>
