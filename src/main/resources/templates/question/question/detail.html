<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>질문 상세</title>
    <!--/* static 폴더가 웹 루트(/) → static/resource/style.css 는 /resource/style.css */-->
    <link rel="stylesheet" type="text/css" th:href="@{/resource/style.css}">
</head>
<body>

<h1 th:text="${question.subject}"></h1>
<div th:text="${question.content}"></div>

<!--/* question.answers 는 LAZY 컬렉션. 서비스의 트랜잭션은 이미 끝났지만 OSIV 덕분에 여기서 조회된다 */-->
<h5 th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>
<ul>
    <li th:each="answer : ${question.answers}">
        <span th:text="${answer.content}"></span>
        <small th:text="${answer.createDate}"></small>
    </li>
</ul>

<!--/* 답변 등록: POST /questions/{id}/answers, textarea 의 name="content" 가 @RequestParam content 로 전달 */-->
<form th:action="@{|/questions/${question.id}/answers|}" method="post">
    <textarea name="content" rows="5"></textarea>
    <input type="submit" value="답변등록">
</form>

</body>
</html>
