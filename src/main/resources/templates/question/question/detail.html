<html layout:decorate="~{layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${question.subject}">질문 상세</title>
</head>
<div layout:fragment="content" class="container my-3">
    <!--/* 질문 */-->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <div class="card my-3">
        <div class="card-body">
            <!--/* white-space: pre-line → 입력한 줄바꿈을 그대로 보여 준다 */-->
            <div class="card-text" style="white-space: pre-line;" th:text="${question.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${question.author?.username}"></div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <!--/* 글쓴이에게만 수정 버튼. #authentication.name: 로그인한 아이디 */-->
            <div class="my-3" sec:authorize="isAuthenticated()" th:if="${question.isAuthor(#authentication.name)}">
                <a th:href="@{|/questions/${question.id}/modify|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <!--/* method="DELETE": global.js 가 POST + _method=DELETE + CSRF 토큰으로 보낸다 */-->
                <a th:href="@{|/questions/${question.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
        </div>
    </div>

    <!--/* question.answers 는 LAZY 컬렉션. 서비스의 트랜잭션은 이미 끝났지만 OSIV 덕분에 여기서 조회된다 */-->
    <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answers)}개의 답변이 있습니다.|"></h5>
    <div class="card my-3" th:each="answer : ${question.answers}">
        <div class="card-body">
            <div class="card-text" style="white-space: pre-line;" th:text="${answer.content}"></div>
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${answer.author?.username}"></div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3" sec:authorize="isAuthenticated()" th:if="${answer.isAuthor(#authentication.name)}">
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}/modify|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <a th:href="@{|/questions/${question.id}/answers/${answer.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
        </div>
    </div>

    <!--/* 답변 등록: POST /questions/{id}/answers, textarea 의 name="content" 가 @RequestParam content 로 전달 */-->
    <form th:action="@{|/questions/${question.id}/answers|}" method="post" class="my-3" th:object="${form}"
          onsubmit="Answer__submitWriteForm(this); return false;">
        <div th:replace="~{form_errors :: formErrorsFragment}"></div>
        <!--/* 로그인하지 않았으면 입력칸을 비활성화하고 로그인 링크를 보여 준다 (교재 3-08) */-->
        <textarea sec:authorize="isAnonymous()" disabled rows="10" class="form-control"
                  placeholder="로그인 후 답변을 작성할 수 있습니다."></textarea>
        <a sec:authorize="isAnonymous()" th:href="@{/users/login}" class="btn btn-outline-primary my-2">로그인하고 답변하기</a>
        <textarea sec:authorize="isAuthenticated()" th:field="*{content}" rows="10" class="form-control"></textarea>
        <input sec:authorize="isAuthenticated()" type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>

    <script>
        // 클라이언트 검증: 빠른 피드백용. 진짜 방어선은 서버 검증(@Valid)이다 (14168 35~36강)
        function Answer__submitWriteForm(form) {
            form.content.value = form.content.value.trim();

            if (form.content.value.length === 0) {
                alert("내용을 입력해주세요.");
                form.content.focus();
                return;
            }

            form.submit();
        }
    </script>
</div>
</html>
