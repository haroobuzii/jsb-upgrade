<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--/* 각 페이지의 <title> 이 $CONTENT_TITLE, 여기의 SBB 가 $LAYOUT_TITLE → "질문 목록 | SBB" */-->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">SBB</title>
    <!--/* CSRF 토큰: th:action 폼에는 자동으로 들어가지만, JS 로 만드는 요청(017의 삭제 링크 등)은 여기서 읽어 쓴다 */-->
    <meta name="_csrf" th:content="${_csrf.token}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/resource/style.css}">
    <!--/* defer: HTML 을 다 읽은 뒤 실행 */-->
    <script th:src="@{/resource/global.js}" defer></script>
</head>
<body>
<nav th:replace="~{navbar :: navbarFragment}"></nav>
<!--/* 각 페이지의 layout:fragment="content" 부분이 이 자리에 들어간다 */-->
<th:block layout:fragment="content"></th:block>
<!--/* Bootstrap JS: 햄버거 메뉴(collapse) 같은 동작용. bundle 은 드롭다운에 필요한 Popper 포함 */-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
</body>
</html>
