spring:
  application:
    name: sbb
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        # LAZY 컬렉션을 하나 꺼낼 때, 같은 영속성 컨텍스트에 있는 다른 엔티티들의 것도 IN 으로 최대 100개까지 한 번에 조회
        # → 목록에서 질문 10개의 답변을 10번이 아니라 1번에 (N+1 → 1+1)
        default_batch_fetch_size: 100
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
