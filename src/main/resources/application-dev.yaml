spring:
  thymeleaf:
    # 개발 중에는 템플릿을 캐시하지 않는다 → html 수정 후 새로고침만 하면 바로 반영
    cache: false
    # classpath(build 결과물) 대신 소스 폴더의 템플릿을 직접 읽는다 → 재컴파일 없이 반영
    prefix: file:src/main/resources/templates/
  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
